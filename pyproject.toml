[project]
name = "garch-btc-sp"
version = "0.1.0"
description = "Reproduction of GARCH-family Bitcoin / S&P 500 correlation analysis"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "yfinance>=0.2.40",
    "statsmodels>=0.14",
    "arch>=6.3",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pyarrow>=15.0",
    "ipykernel",
]

[project.optional-dependencies]
dev = ["ruff>=0.4", "pre-commit>=3.7", "pytest>=8.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
